[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cookflow"
version = "0.1.0"
description = "Local-first recipe catalog and release builder"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx[socks]>=0.28.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
cookflow = "cookflow.cli:main"

[tool.setuptools.packages.find]
include = ["cookflow*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
